<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../NavBar/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    
</head>
<body>

    
    <div id="navbar"></div>

     <script>
    fetch("../NavBar/navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
    </script>

  <main class="feed">
    <div class="topSpacer"></div>
    <div class="topMovie">
      <img id="topMovieImg" src="https://m.media-amazon.com/images/M/MV5BZDA3ZDExMDUtNjdjOC00YjNhLWIyNGUtNmZhNzJkMDI1ZjUzXkEyXkFqcGc@._V1_.jpg" alt="Top Movie">
      <div class="topMovieOverlay"></div>
      <div class="topMovieInfo">
        <h2 id="welcomeMsg"></h2>
        <div id="suggestedLine"></div>
        <h1 id="topMovieTitle" class="content topMovieTitle"></h1>
        <div class="buttons"> 
          <button id="watchNowBtn" class="btn primary">Watch Now</button> 
          <button id="moreInfoBtn" class="btn secondary">More Info</button>
        </div>
      </div>
    </div>

    
    <div class="feed-header">
      <div class="feed-header title">Movies Catalog</div>
      <button id="sortBtn" class="feed-header btn">Sort A–Z</button>
    </div>
    <div id="feedContainer" class="feed-row"></div>
</main>


<script src="script.js"></script>
<script src="../NavBar/script.js"></script>

</body>
</html>
