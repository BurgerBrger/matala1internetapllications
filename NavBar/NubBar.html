<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavBar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar-custom">
    <!-- לוגו -->
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="logo" />
    </div>

    <!-- קישורים -->
    <nav class="nav-links">
      <a href="#">HOME</a>
      <a href="#">TV SHOWS</a>
      <a href="#">MOVIES</a>
      <a href="#">GAMES</a>
      <a href="#">POPULAR</a>
    </nav>

    <!-- אייקונים צד ימין -->
    <div class="right-section">
      <img src="https://img.icons8.com/ios-filled/24/ffffff/search.png" alt="search" class="icon">
      <img src="https://img.icons8.com/ios-filled/24/ffffff/bell.png" alt="notification" class="icon">
      <img src="https://i.pravatar.cc/40" alt="profile" class="profile-pic">
    </div>
  </header>
</body>
</html>
