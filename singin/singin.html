<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"> <!-- הקישור ל־CSS החיצוני -->
</head>
<body>
  <div class="card">
    <h1>Log In To The Account</h1>
    
    <div class="from_group">
      <label for="username">User Name</label>
      <input type="text" id="username" name="username">
    </div>
    
    <div class="from_group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password">
    </div>
    
    <div class="remember-me">
      <input type="checkbox" id="remember">
      <label for="remember">Remember Me</label>
    </div>
    
    <button class="btn_log">Log In</button>
    <button class="btn_code">With Code</button>
    
    <p class="forget">Forget Your Password?</p>
    <p class="dont">Don't have an account?</p>
  </div>
</body>
</html>
