<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap text-center">
    <h1 class="title mb-4">Who Is Watching</h1>
    <section class="row justify-content-center g-4">
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card p-2">
          <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Rock guitarist">
          <p class="name mt-2">Yosi</p>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card p-2">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Guitar on stage">
          <p class="name mt-2">Yuval</p>
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card p-2">
          <img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2?q=80&w=800&auto=format&fit=crop" class="card-img-top" alt="Concert crowd">
          <p class="name mt-2">David</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
